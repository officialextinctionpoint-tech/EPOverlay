name: Build Windows overlay
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ExtinctionPointOverlay
          path: |
            src-tauri/target/release/extinction-overlay.exe
            src-tauri/target/release/bundle/nsis/*.exe
